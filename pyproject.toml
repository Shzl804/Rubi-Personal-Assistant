[project]
name = "rubi-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shahzeel", email = "shahzeelahmadbrand@gmail.com" }
]
requires-python = ">=3.11"
